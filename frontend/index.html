    <!--
      THESIS: the calendar isn't a checklist you tick off — it's a leaded window you fill in, pane by pane, over a year.
      OWN-WORLD: dark stone-cathedral ground; near-black oxidized lead grid; jewel-tone panes lit by real album art,
        graded a touch warmer/cooler per season; Alegreya for the personal header, IBM Plex Sans for grid/UI.
      STORY: each day is a pane. Filled panes glow with that day's own art; today/backfillable days sit clear and
        waiting; future days are unglazed lead, nothing to see yet. Clicking a pane lifts it forward to fill or inspect it.
      FIRST VIEWPORT: "{name}'s / year in music" top-left in Fraunces against dark stone; below, an inset window
        framed by a Calendar/Playlist tab bar, then the leaded 7-column month grid, tracery-styled nav flanking the month label.
      FORM: user-pinned direction — medieval "calendar window" leaded-glass tradition (Chartres Labors-of-the-Months).
        Pinned by the user; no seed key (roll intentionally skipped for a brief-pinned world).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>
